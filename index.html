<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>By: Will Khotsyphom</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #080b16, #102a43);
    }
    main {
      width: min(650px, 100%);
      padding: clamp(40px, 8vw, 72px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }
    .icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border-radius: 18px;
      color: #07111f;
      background: #57e3d2;
      font: bold 22px monospace;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 5rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }
    p {
      margin: 22px 0 0;
      color: #b7c7da;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">&gt;_</div>
    <h1>Awesome webpage!</h1>
    <p>Created by <strong>Will Khotsyphom</strong></p>
  </main>
</body>
</html>
